# anvilkit-job-access-sidecar configuration (reviewed, secret-free; baked
# into the image, readable by the sidecar container only). Precedence is
# defaults < this file < the allowlisted environment overrides the Job
# template sets: ANVILKIT_SIDECAR_CONTROL_ADDRESS and
# ANVILKIT_SIDECAR_IDENTITY_MODE (the environment's placement and identity
# mode), ANVILKIT_SIDECAR_BACKEND, ANVILKIT_SIDECAR_LAUNCH_KEY,
# ANVILKIT_SIDECAR_POD_UID (downward API metadata.uid) and
# ANVILKIT_SIDECAR_LAUNCH_ENVELOPE (the typed launch envelope); the launch
# facts are refused inside this file. Unknown keys fail startup. With
# identity.mode disabled (the default) the process exits before creating a
# socket: a Job whose environment supplies no trusted identity runs nothing.
sockets:
  dir: /run/anvilkit/sockets
  trusted_uid: 0
  candidate_uid: 10001
  owner_uid: 10002
control:
  timeout: 15s
# development: the top-level DEVELOPMENT_ONLY guard (P0.1): the plaintext
# development identity is admitted only while it is true; the image bakes
# it false, so a Job template can select development only against an image
# built from a development configuration.
development:
  enabled: false
identity:
  mode: disabled
  # mtls: the workload identity material (P0.1), mounted by the Job template
  # into this container only at /etc/anvilkit/identity (the Workflow chart's
  # anvilkit-job-access-sidecar-identity Certificate); server_name is the
  # DNS SAN Control's certificate must carry. The files are watched and
  # reloaded as a whole.
  mtls:
    cert_file: /etc/anvilkit/identity/tls.crt
    key_file: /etc/anvilkit/identity/tls.key
    ca_file: /etc/anvilkit/identity/ca.crt
    server_name: anvilkit-agent-control
# mcp.server_name is the DNS SAN MCP's certificate must carry under mtls
# (the address is the environment's ANVILKIT_SIDECAR_MCP_ADDRESS).
mcp:
  server_name: anvilkit-agent-mcp
limits:
  max_input_bytes: 1048576
  max_transfer_bytes: 67108864
  max_manifest_bytes: 16384
  request_timeout: 60s
  upload_timeout: 5m
shutdown_timeout: 20s
